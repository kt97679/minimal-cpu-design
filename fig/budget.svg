<svg xmlns="http://www.w3.org/2000/svg" width="720" height="150" viewBox="0 0 720 150" role="img" aria-label="Gate budget of the winning machine: data RAM 4,597 gates, processor 1,509, whole program in ROM 912, glue 60.">
<rect width="720" height="150" fill="#fbfbfd"/>
<text x="16" y="26" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#1f2328">Where the 7,078 gates go</text>
<text x="16" y="45" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#57606a">the ten-instruction machine, memory built from gates</text>
<g>
<rect x="16" y="62" width="447" height="34" fill="#d1495b"/>
<rect x="463" y="62" width="147" height="34" fill="#3d5a80"/>
<rect x="610" y="62" width="89" height="34" fill="#2a9d8f"/>
<rect x="699" y="62" width="5" height="34" fill="#8d99ae"/>
</g>
<text x="24" y="84" font-family="system-ui,sans-serif" font-size="13" fill="#ffffff" font-weight="600">data RAM  4,597</text>
<text x="471" y="84" font-family="system-ui,sans-serif" font-size="13" fill="#ffffff" font-weight="600">core 1,509</text>
<text x="618" y="84" font-family="system-ui,sans-serif" font-size="12" fill="#ffffff" font-weight="600">ROM 912</text>
<text x="16" y="120" font-family="system-ui,sans-serif" font-size="12" fill="#57606a">23 words of variables and the sort array</text>
<text x="463" y="120" font-family="system-ui,sans-serif" font-size="12" fill="#57606a">processor</text>
<text x="610" y="120" font-family="system-ui,sans-serif" font-size="12" fill="#57606a">whole program</text>
<text x="16" y="140" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e">The processor is 21% of the machine. Everything left of it is memory.</text>
</svg>
