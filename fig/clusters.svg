<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" role="img" aria-label="Every design measured, by gate count on a logarithmic scale. Designs that can index an array without self-modifying code cluster between 7,078 and 8,848 gates; designs that cannot cluster between 47,295 and 164,783. Nothing lies between.">
<rect width="720" height="200" fill="#fbfbfd"/>
<text x="16" y="26" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#1f2328">Every design measured, by total gates</text>
<text x="16" y="45" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#57606a">logarithmic scale &#183; nothing lands between the two groups</text>
<line x1="60" y1="150" x2="690" y2="150" stroke="#8b949e" stroke-width="1"/>
<g font-family="system-ui,sans-serif" font-size="11" fill="#57606a" text-anchor="middle">
<text x="60" y="168">5,000</text><text x="217" y="168">10,000</text><text x="427" y="168">50,000</text><text x="584" y="168">100,000</text><text x="690" y="168">200,000</text>
</g>
<g fill="#2a9d8f">
<circle cx="177" cy="120" r="7"/><circle cx="182" cy="120" r="7"/><circle cx="189" cy="120" r="7"/><circle cx="196" cy="120" r="7"/><circle cx="212" cy="120" r="7"/>
</g>
<g fill="#d1495b">
<circle cx="420" cy="120" r="7"/><circle cx="427" cy="120" r="7"/><circle cx="437" cy="120" r="7"/><circle cx="471" cy="120" r="7"/><circle cx="643" cy="120" r="7"/>
</g>
<rect x="150" y="96" width="90" height="3" fill="#2a9d8f"/>
<rect x="400" y="96" width="260" height="3" fill="#d1495b"/>
<text x="150" y="88" font-family="system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#2a9d8f">can index: 7,078 &#8211; 8,848</text>
<text x="400" y="88" font-family="system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#d1495b">must rewrite its own code: 47,295 &#8211; 164,783</text>
<text x="16" y="190" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e">One instruction group decides which side a machine lands on. Instruction count does not.</text>
</svg>
